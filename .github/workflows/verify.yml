name: KeepIt checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test shared code
        run: .\kotlin.bat test -m shared
      - name: Prepare Android SDK and accept its licenses
        uses: android-actions/setup-android@v4
        env:
          # Provision clean package metadata instead of reusing the runner's preinstalled SDK.
          ANDROID_SDK_ROOT: ${{ runner.temp }}\keepit-android-sdk
          ANDROID_HOME: ${{ runner.temp }}\keepit-android-sdk
        with:
          cmdline-tools-version: '12266719'
          accept-android-sdk-licenses: 'true'
          packages: 'build-tools;37.0.0'
      - name: Build the Android app
        run: .\kotlin.bat build -m androidApp
