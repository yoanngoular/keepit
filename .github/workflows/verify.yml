name: KeepIt checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test shared code
        run: .\kotlin.bat test -m shared
      - name: Build the Android app
        run: .\kotlin.bat build -m androidApp
